# V5: the kata-agent pulls the init-data measurement in and waits for it.
# Wants= cannot break the boot (a failed measurement is refused by the Authority's replay,
# not by the guest), After= holds even though kata-agent.service is started late by
# kata-agent.path, and drop-ins are untouched by presets. Second anchor next to the
# preset and the shipped wants symlink: no single build step can silently drop the unit.
[Unit]
Wants=initdata-measure.service
After=initdata-measure.service
