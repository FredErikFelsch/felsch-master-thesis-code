# V4.4c: the four ServiceAccounts. Identity is a property of the pod, so each
# principal runs in its own pod. rbac.yaml binds a Role only to controller-sa.
# orchestrator-sa, runner-sa and authority-sa get no bindings at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: agent-system
automountServiceAccountToken: false      # the orchestrator gets no API token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-sa
  namespace: agent-system
# controller-sa needs an API token (it creates Jobs). Its Role is narrow.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-sa
  namespace: agent-system
automountServiceAccountToken: false      # the runner gets no API token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authority-sa
  namespace: agent-system
automountServiceAccountToken: false      # the Authority/Gateway needs no API
