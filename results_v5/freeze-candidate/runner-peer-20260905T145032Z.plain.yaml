apiVersion: v1
kind: Pod
metadata:
  annotations: {}
  labels:
    app: runner
    managed-by: trusted-runner-controller-v5
  name: runner-peer
  namespace: v5-probe
spec:
  activeDeadlineSeconds: 2400
  automountServiceAccountToken: false
  containers:
  - command:
    - /usr/local/bin/python3
    - -m
    - booking_v5.probe_bind
    - --run
    - probe-20260905T145032Z
    - --step
    - '1'
    - --fragment
    - 6b91f66f4638a23a1ed389ce770bc7bb3795c3699019b4e356f5297c8d899c41
    - --state
    - 3ddd6efa93e6380a6d2fe8f02963d9f803a53c250435c5950da2a722a0909c43
