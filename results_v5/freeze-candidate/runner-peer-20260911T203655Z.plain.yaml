  restartPolicy: Never
  runtimeClassName: kata-remote
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: default
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 16Mi
    name: tmp
