apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
    v5/init-data-sha256: 376185a12610e74b703dd84c6a613586e748b3cd32c49314ba7c9783144af54b
  labels:
    app: runner
    managed-by: trusted-runner-controller-v5
  name: runner-attach
  namespace: v5-probe
spec:
  activeDeadlineSeconds: 1200
  automountServiceAccountToken: false
  containers:
  - command:
    - /usr/local/bin/python3
    - -u
    - -c
    - "import sys\nprint('ATTACH_READY', flush=True)\nfor line in sys.stdin:\n   \
      \ line = line.rstrip('\\n')\n    if line == 'quit': break\n    print('echo:'\
      \ + line, flush=True)\n"
    image: europe-west1-docker.pkg.dev/project-example/thesis/booking@sha256:af8948d563bd09e09cffa4200f6714cffcee46b0a4a1c59320cc555b008a0361
    name: runner
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    stdin: true
    stdinOnce: false
    tty: false
    volumeMounts:
    - mountPath: /tmp
      name: tmp
  imagePullSecrets:
  - name: ar-pull
  restartPolicy: Never
  runtimeClassName: kata-remote
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: default
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 16Mi
    name: tmp
