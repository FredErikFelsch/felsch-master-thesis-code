apiVersion: v1
kind: Pod
metadata:
  annotations: {}
  labels:
    app: runner
    managed-by: trusted-runner-controller-v5
  name: runner-attach
  namespace: v5-probe
spec:
  activeDeadlineSeconds: 1200
  automountServiceAccountToken: false
  containers:
  - command:
    - /usr/local/bin/python3
    - -u
    - -c
    - "import sys\nprint('ATTACH_READY', flush=True)\nfor line in sys.stdin:\n   \
      \ line = line.rstrip('\\n')\n    if line == 'quit': break\n    print('echo:'\
      \ + line, flush=True)\n"
    image: europe-west1-docker.pkg.dev/project-example/thesis/booking@sha256:a8f30d772bd54594808a4b13d7f0c3a6797343f953b38afcc4c6d5fd60928dcc
    name: runner
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    stdin: true
    stdinOnce: false
    tty: false
    volumeMounts:
    - mountPath: /tmp
      name: tmp
  imagePullSecrets:
  - name: ar-pull
  restartPolicy: Never
  runtimeClassName: kata-remote
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: default
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 16Mi
    name: tmp
