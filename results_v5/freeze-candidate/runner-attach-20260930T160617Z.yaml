apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
    v5/init-data-sha256: bb5c4927889cd4aa614641a9f38b2a7e94033ea4da37e2eb244517b0fe7f6568
  labels:
    app: runner
    managed-by: trusted-runner-controller-v5
  name: runner-attach
  namespace: v5-probe
spec:
  activeDeadlineSeconds: 1200
  automountServiceAccountToken: false
  containers:
  - command:
    - /usr/local/bin/python3
    - -u
    - -c
    - "import sys\nprint('ATTACH_READY', flush=True)\nfor line in sys.stdin:\n   \
      \ line = line.rstrip('\\n')\n    if line == 'quit': break\n    print('echo:'\
      \ + line, flush=True)\n"
    image: europe-west1-docker.pkg.dev/project-example/thesis/booking@sha256:8864e0692a5fbe73135bc255d26a61d638aced26950210338a4bb581b3986a34
    name: runner
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    stdin: true
    stdinOnce: false
    tty: false
    volumeMounts:
    - mountPath: /tmp
      name: tmp
  imagePullSecrets:
  - name: ar-pull
  restartPolicy: Never
  runtimeClassName: kata-remote
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: default
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 16Mi
    name: tmp
