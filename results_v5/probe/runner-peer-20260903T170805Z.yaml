apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
    v5/init-data-sha256: 5fc8fe86e6b05aa6fb6c67a039747a0a7b5cd94461585f956a6828e3fd83fafb
  labels:
    app: runner
    managed-by: trusted-runner-controller-v5
  name: runner-peer
  namespace: v5-probe
spec:
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  containers:
  - command:
    - python3
    - -c
    - "\nimport urllib.request, json, time\nrd = 'fa9d82f651e1c731468af49027bbf9c0a4ed5793daa987083ca4b3413f7e3ecc'\n\
      try:\n    b = urllib.request.urlopen('http://127.0.0.1:8006/aa/evidence?runtime_data='\
      \ + rd, timeout=20).read()\n    print('EVIDENCE_OK', len(b)); print('EVIDENCE_B64\
      \ ' + __import__('base64').b64encode(b).decode())  # full, one line: the offline-verification\
      \ fixture\nexcept Exception as e:\n    print('EVIDENCE_FAIL', repr(e))\n# P3:\
      \ the AA REST API (guest-components f156103, api-server-rest/src/router.rs)\
      \ exposes runtime\n# measurement as POST /aa/aael {domain, operation, content}\
      \ (the first probe used a wrong path\n# and read its 404 as \"unavailable\"\
      ). /info reports the TEE and feature flags. A successful\n# extend must change\
      \ RTMR3 and add an AA event log to the evidence: fetch evidence again to see.\n\
      try:\n    print('AA_INFO', urllib.request.urlopen('http://127.0.0.1:8006/info',\
      \ timeout=10).read().decode()[:400])\nexcept Exception as e:\n    print('AA_INFO_FAIL',\
      \ repr(e))\ntry:\n    body = json.dumps({'domain': 'v5-probe', 'operation':\
      \ 'p3-extend', 'content': rd}).encode()\n    req = urllib.request.Request('http://127.0.0.1:8006/aa/aael',\
      \ data=body, method='POST', headers={'Content-Type': 'application/json'})\n\
      \    r = urllib.request.urlopen(req, timeout=10); body = r.read()\n    # the\
      \ AA answers 200 even when it refuses (\"success\":\"false\"): judge the body,\
      \ not the status\n    print(('RTMR_OK' if b'\"success\":\"true\"' in body.replace(b'\
      \ ', b'') else 'RTMR_REFUSED'), r.status, body[:200])\n    b2 = urllib.request.urlopen('http://127.0.0.1:8006/aa/evidence?runtime_data='\
      \ + rd, timeout=20).read()\n    print('EVIDENCE_AFTER_EXTEND_B64 ' + __import__('base64').b64encode(b2).decode())\n\
      except Exception as e:\n    print('RTMR_UNAVAILABLE', repr(e))\ntime.sleep(1800)\n"
    image: europe-west1-docker.pkg.dev/project-example/thesis/booking@sha256:71b69c1af221d3fdaf06bdc5f24a2a28b3db77a607d8ed806424f9c25ae9e9ef
    name: runner
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    tty: false
    volumeMounts:
    - mountPath: /tmp
      name: tmp
  imagePullSecrets:
  - name: ar-pull
  restartPolicy: Never
  runtimeClassName: kata-remote
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: default
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 16Mi
    name: tmp
