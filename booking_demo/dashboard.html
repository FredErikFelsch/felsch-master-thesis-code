<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent under authority</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1a1a1a; --mute:#666; --line:#dcdcdc;
          --ok:#2e7d32; --bad:#b3261e; --wait:#b8860b; --blue:#1f5f9f; --grey:#9e9e9e;
          --red-bg:#fdecea; --green-bg:#e9f5ea; --blue-bg:#e6f0fb; --gold-bg:#fff8e6; --grey-bg:#f0f0f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  .badge { padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px; letter-spacing:.3px; }
  .badge.v0 { background:var(--red-bg); color:var(--bad); }
  .badge.v3 { background:var(--green-bg); color:var(--ok); }
  .badge.v5 { background:var(--blue-bg); color:var(--blue); }
  .badge.devops { background:var(--gold-bg); color:#7a5a00; }
  .kpis { margin-left:auto; display:flex; gap:10px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:10px; padding:5px 12px; min-width:110px; text-align:center; }
  .kpi .n { font-size:24px; font-weight:700; line-height:1.1; }
  .kpi .l { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.4px; }
  .kpi.bad .n { color:var(--bad); } .kpi.ok .n { color:var(--ok); }
  .status { font-size:12px; color:var(--mute); }
  .runpick { margin-left:6px; font-size:12px; }

  /* pipeline strip */
  .pipe { display:grid; grid-template-columns:repeat(7, 1fr); gap:0; padding:12px 20px 0; }
  .st { position:relative; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px 8px; margin-right:22px; min-height:112px; }
  .st:last-child { margin-right:0; }
  .st::after { content:"\2192"; position:absolute; right:-19px; top:44%; color:var(--grey); font-size:18px; }
  .st:last-child::after { content:""; }
  .st h3 { margin:0; font-size:14px; }
  .st .alias { font-size:11px; color:var(--blue); font-weight:600; }
  .st .what { font-size:12px; color:var(--mute); margin-top:4px; min-height:32px; white-space:pre-line; }
  .st .cnt { margin-top:6px; font-size:12px; display:flex; gap:10px; }
  .st .cnt b.ok { color:var(--ok); } .st .cnt b.bad { color:var(--bad); } .st .cnt b.wait { color:var(--wait); }
  .st.absent { background:var(--grey-bg); border-style:dashed; }
  .st.absent h3, .st.absent .what, .st.absent .alias { color:var(--grey); }
  .st.absent .cnt::before { content:"absent in this mode"; color:var(--bad); font-weight:600; }

  main { display:grid; grid-template-columns: 0.9fr 1.5fr 0.8fr; gap:14px; padding:12px 20px 20px;
         max-width:100%; }
  /* min-width:0 keeps a long unbreakable value (an offer id, a base64 token) from widening
     its grid column beyond the viewport. A grid item defaults to min-width:auto. The rules
     below decide where long values wrap. */
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
            min-height:200px; min-width:0; overflow:hidden; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--mute); margin:0 0 10px; }
  /* The free-form request is input to planning: the agent proposes, a human approves the
     compiled policy, and only then does anything run. */
  .compose { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .compose textarea { width:100%; min-height:64px; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .compose .row { display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .compose select, .compose button { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .compose button.go { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  .compose button.go[disabled] { background:var(--grey); border-color:var(--grey); cursor:not-allowed; }
  .compose label.inj { display:inline-flex; align-items:center; gap:5px; color:var(--bad); font-weight:600; }
  .compose .note { margin-left:auto; font-size:12px; color:var(--mute); }
  .compose .err { margin-top:6px; font-size:12px; color:var(--bad); }

  /* Two zones: what the agent can write into, and what it cannot reach. */
  section.zone { border-left:4px solid var(--grey); }
  section.zone::before { display:block; font-size:11px; font-weight:700; letter-spacing:.6px;
                         text-transform:uppercase; margin-bottom:6px; content:attr(data-zone); }
  section.untrusted { border-left-color:var(--bad); }
  section.untrusted::before { color:var(--bad); }
  section.trusted { border-left-color:var(--ok); }
  section.trusted::before { color:var(--ok); }

  .task { background:var(--gold-bg); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .mail { white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#fafafa; border:1px solid var(--line); border-radius:8px; padding:8px 10px; max-height:300px; overflow:auto; }
  .mail .inj { background:#ffe2de; color:#7a1a12; }
  .tools { font-size:12px; color:var(--mute); margin:8px 0; padding:8px 10px; background:var(--grey-bg); border-radius:8px; }
  .tools code { background:#fff; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  /* The agent's own conversation. Real provider answers are long, so the column gets a
     fixed height and scrolls instead of stretching the page. */
  #transcript { max-height:420px; overflow-y:auto; overflow-x:hidden; }
  .bubble { border-radius:10px; padding:7px 10px; margin:6px 0; border:1px solid var(--line); font-size:12px;
            overflow-wrap:anywhere; word-break:break-word; }
  .bubble.call { background:#fff; border-left:4px solid var(--ink); font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  .bubble.call b { font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .bubble.result { background:#fafafa; color:var(--mute); font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  .bubble.final { background:var(--gold-bg); font-size:13px; }
  .bubble.user { background:var(--blue-bg); border-left:4px solid var(--blue); font-size:13px; }
  .chatreply { border:2px solid var(--blue); background:var(--blue-bg); border-radius:10px; padding:10px; margin-bottom:12px; }
  .chatreply textarea { width:100%; min-height:48px; box-sizing:border-box; margin-top:6px; font:inherit; }

  /* the proposal table */
  table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top;
           overflow-wrap:anywhere; word-break:break-word; }
  th { color:var(--mute); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  .prop td.who { white-space:nowrap; font-weight:700; }
  .prop td.args { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--mute); word-break:break-all; }
  .cell { border-radius:6px; padding:4px 6px; font-size:11px; line-height:1.3; min-width:86px; }
  .cell.pass { background:var(--green-bg); color:var(--ok); }
  .cell.stop { background:var(--red-bg); color:var(--bad); font-weight:600; }
  .cell.wait { background:var(--gold-bg); color:#7a5a00; font-weight:600; }
  .cell.absent { background:var(--grey-bg); color:var(--grey); }
  .cell.skip { color:var(--grey); }
  .cell.effect { background:var(--green-bg); color:var(--ok); font-weight:700; }
  .cell.harm { background:var(--red-bg); color:var(--bad); font-weight:700; }
  .cell .why { display:block; font-weight:400; opacity:.85; }
  tr.tdrow td { padding:2px 6px 8px; }
  .phases { display:flex; height:9px; border-radius:5px; overflow:hidden; background:#eee; width:100%; }
  .phases span { display:block; height:100%; }
  .ph-spawn { background:#b0bec5; } .ph-evidence { background:#7986cb; } .ph-verification { background:#4db6ac; } .ph-execution { background:#66bb6a; } .ph-destroy { background:#e0e0e0; }
  .tdmeta { font-size:11px; color:var(--mute); font-family:ui-monospace,Menlo,monospace; overflow-wrap:anywhere; }
  .legend { font-size:11px; color:var(--mute); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 3px 0 8px; vertical-align:middle; }

  .banner { padding:10px 14px; border-radius:10px; margin-bottom:12px; font-weight:600; }
  .banner.safe { background:var(--green-bg); color:var(--ok); }
  .banner.harm { background:var(--red-bg); color:var(--bad); }
  .banner.stop { background:var(--gold-bg); color:#7a5a00; }
  .approval { border:2px solid var(--wait); background:var(--gold-bg); border-radius:10px; padding:10px; margin-bottom:12px; }
  .approval button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); cursor:pointer; margin-right:8px; }
  .approval button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .approval button.no { background:#fff; }
  .plan { border:2px solid var(--blue); border-radius:10px; padding:10px; margin-bottom:12px; background:var(--blue-bg); font-size:13px; }
  .plan h3 { margin:0 0 6px; font-size:14px; color:var(--blue); }
  .plan .steps span { display:inline-block; padding:3px 9px; border-radius:999px; background:#fff; border:1px solid var(--blue); margin-right:6px; font-weight:600; }
  .plan .warn { color:var(--bad); margin-top:6px; } .plan .fine { color:var(--ok); margin-top:6px; }
  .plan.rejected { border-color:var(--bad); background:var(--red-bg); }
  .plan.rejected h3 { color:var(--bad); }
  .plan.approved { border-color:var(--ok); background:var(--green-bg); }
  .ap { margin-top:8px; border:1px solid var(--ok); border-radius:8px; padding:8px; background:var(--green-bg); }
  .tc { margin-top:8px; border:1px dashed var(--grey); border-radius:8px; padding:8px; background:var(--grey-bg); color:var(--mute); }
  .ap h4, .tc h4 { margin:0 0 4px; font-size:12px; letter-spacing:.04em; }
  .ap table, .tc table { border-collapse:collapse; font-size:12px; }
  .ap td, .tc td { padding:1px 10px 1px 0; vertical-align:top; }
  .plan.approved h3 { color:var(--ok); }
  .attacks { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:8px; margin:8px 0 12px; }
  .attack { border:2px solid var(--bad); border-radius:10px; padding:8px; background:#fff; font-size:12px; }
  .attack h3 { margin:0 0 4px; font-size:13px; color:var(--bad); }
  .attack .pass { display:inline-block; margin-top:4px; padding:2px 8px; border-radius:999px; background:var(--green-bg); color:var(--ok); font-weight:700; }
  .attack .fail { display:inline-block; margin-top:4px; padding:2px 8px; border-radius:999px; background:var(--red-bg); color:var(--bad); font-weight:700; }

  /* who holds what */
  .holds { font-size:12px; }
  .holds div { display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px; padding:5px 0; border-bottom:1px solid var(--line); }
  .holds b { font-weight:700; }
  .holds .none { color:var(--grey); }
  .holds .cred { color:var(--bad); font-weight:600; }
  .holds .tok { color:var(--blue); font-weight:600; }
  tr.bad td { background:#fff3f1; color:var(--bad); }
  /* plan -> policy transform panel */
  #transform { padding:0 20px; }
  .tf { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:14px; align-items:stretch; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .tf-col h3 { margin:0 0 8px; font-size:13px; }
  .tf-in h3 { color:var(--mute); } .tf-out h3 { color:var(--ok); }
  .tf ol { margin:0; padding-left:18px; font-size:12px; } .tf li { margin:4px 0; }
  .tf-rule { color:var(--blue); } .tf-none { color:var(--grey); }
  .tf-arrow { align-self:center; color:var(--mute); font-size:12px; font-weight:600; white-space:nowrap; }
  .tf-hint, .tf-note { font-size:11px; color:var(--mute); margin-top:8px; }
  .tf-digest { font-size:12px; margin-top:8px; font-family:ui-monospace,Menlo,monospace; overflow-wrap:anywhere; }
  .tf-in { background:#fafafa; border-radius:8px; padding:8px 10px; } .tf-out { background:var(--green-bg); border-radius:8px; padding:8px 10px; }
</style>
</head>
<body>
<header>
  <h1>Agent under authority</h1>
  <span id="mode" class="badge v0">&mdash;</span>
  <span id="model" class="status"></span>
  <select id="demopick" class="runpick" title="which demo"><option value="booking">Flight booking</option><option value="devops">DevOps cluster</option></select>
  <select id="runpick" class="runpick" title="replay a recorded run"></select>
  <div class="kpis">
    <div class="kpi"><div class="n" id="k-proposals">0</div><div class="l">proposals</div></div>
    <div class="kpi"><div class="n" id="k-refused">0</div><div class="l">refused</div></div>
    <div class="kpi ok"><div class="n" id="k-effects">0</div><div class="l">effects</div></div>
    <div class="kpi bad"><div class="n" id="k-unauth">0</div><div class="l">unauthorised</div></div>
    <div class="kpi"><div class="n" id="k-run">&mdash;</div><div class="l">run</div></div>
  </div>
</header>

<div class="pipe" id="pipe"></div>
<div id="transform"></div>

<main>
  <section class="zone untrusted" data-zone="Agent conversation · untrusted">
    <h2>The agent (untrusted)</h2>
    <div class="compose">
      <textarea id="ask" placeholder="Book a flight to EWR, at most 50 EUR."></textarea>
      <div class="row">
        <select id="ask-world" title="which world the tools reach">
          <option value="mock">mock catalogue</option>
          <option value="duffel">duffel (live, real orders)</option>
          <option value="serpapi">serpapi (live search only)</option>
        </select>
        <select id="ask-mode" title="with or without the monitor">
          <option value="v3">v3 · monitor</option>
          <option value="v0">v0 · no monitor</option>
          <option value="v5-local">v5 local · attested</option>
          <option value="v5">v5 cluster · attested (CoCo)</option>
        </select>
        <select id="ask-model" title="the agent model">
          <option value="scripted">scripted agent</option>
        </select>
        <label class="inj"><input type="checkbox" id="ask-inject"> inject</label>
        <button class="go" id="ask-go" onclick="startRun()">Send</button>
        <span class="note" id="ask-status"></span>
      </div>
      <div class="err" id="ask-err"></div>
    </div>
    <div id="task" class="task"></div>
    <div id="mail" class="mail"></div>
    <div class="tools" id="tools"></div>
    <div id="transcript"></div>
  </section>
  <section class="zone trusted" data-zone="Trusted control plane · the agent cannot write here">
    <h2>Every proposal, station by station</h2>
    <div id="banner"></div>
    <div id="plan"></div>
    <div id="approval"></div>
    <div id="chatreply"></div>
    <table class="prop"><thead><tr id="prophead"></tr></thead><tbody id="rows"></tbody></table>
    <div id="tdlegend"></div>
    <div id="attacks"></div>
  </section>
  <section class="zone trusted" data-zone="Trusted control plane · observed facts and effects">
    <h2>Who holds what</h2>
    <div class="holds" id="holds"></div>
    <h2 style="margin-top:14px">What reached the world</h2>
    <table><thead><tr><th>#</th><th>effect</th><th>details</th></tr></thead><tbody id="world"></tbody></table>
    <h2 style="margin-top:14px">Ledger (gateway)</h2>
    <table><thead><tr><th>step</th><th>operation</th><th>arguments</th></tr></thead><tbody id="ledger"></tbody></table>
  </section>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // --- money:begin (evaluated on its own by booking_v5/tests_code_closure.py) ---------------
  // Minor units per currency for the currencies this system evaluates. Any other currency, or none,
  // shows the raw value. The page guesses no scale, uses no currency library and echoes nothing
  // from the input.
  const MINOR_DIGITS = {EUR: 2, USD: 2, GBP: 2, JPY: 0};
  function money(minor, cur) {
    if (minor === null || minor === undefined) return "?";
    if (!Number.isSafeInteger(minor) || minor < 0) return "invalid amount";
    const code = typeof cur === "string" && /^[A-Z]{3}$/.test(cur) ? cur : "";
    const digits = MINOR_DIGITS[code];
    if (digits === undefined) return minor + " minor units" + (code ? " " + code : "");
    if (digits === 0) return minor + " " + code;
    const unit = 10 ** digits;
    return Math.floor(minor / unit) + "." + String(minor % unit).padStart(digits, "0") + " " + code;
  }
  // --- money:end ----------------------------------------------------------------------------
  // What the human approves, read from the compiled policy, and the deployment's trusted
  // configuration, which nobody approves, in a box of its own.
  const approvedPolicyHtml = ap => {
    if (!ap) return '';
    const pr = ap.parameters || {};
    const rows = [];
    if (pr.origin || pr.destination) rows.push(['journey', `${esc(pr.origin || '—')} → ${esc(pr.destination || '—')}`]);
    if (pr.date) rows.push(['date', esc(pr.date)]);
    if (pr.cabin) rows.push(['cabin', esc(pr.cabin)]);
    for (const [k, v] of Object.entries(pr)) if (!['origin', 'destination', 'date', 'cabin'].includes(k)) rows.push([esc(k), esc(v)]);
    if (ap.budget_minor !== null && ap.budget_minor !== undefined) rows.push(['max payment', `<b>${money(ap.budget_minor, ap.currency)}</b>`]);
    const steps = ap.steps || [];
    const eff = steps.filter(s => s.effect && s.effect !== 'none').map(s => `${esc(s.tool)} (${esc(s.effect)})`);
    if (steps.some(s => s.effect !== null)) rows.push(['allowed effects', eff.join(', ') || 'none']);
    rows.push(['approval before', esc(steps.filter(s => s.approval).map(s => s.tool).join(', ') || 'none')]);
    rows.push(['policy hash', `<span class="tdmeta">${esc(String(ap.digest || '').slice(0, 16))}…</span>`]);
    return `<div class="ap"><h4>APPROVED POLICY · what your approval signs</h4><table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div>`;
  };
  const trustedConfigHtml = tc => {
    const e = Object.entries(tc || {});
    if (!e.length) return '';
    return `<div class="tc"><h4>TRUSTED WORLD CONFIGURATION · set by the deployment, not part of your approval</h4><table>${e.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>`;
  };
  const fmtArgs = a => Object.entries(a || {}).filter(([k]) => k !== 'action_id')
      .map(([k, v]) => k === 'amount_minor' ? money(v, (a || {}).currency) : (k === 'payload' && String(v).length > 24 ? k + '=' + String(v).slice(0, 24) + '…' : k + '=' + v)).join('  ');
  const DOMAINS = {
    booking: {
      worldAlias: 'airline, bank, network',
      localTool: 'read_inbox', inputWord: 'e-mail',
      tools: ['read_inbox','search','select','book','pay','read_secret','send_data'],
      // pay_order is the payment tool of the Duffel world, which shares this descriptor.
      effectTools: ['pay','pay_order','book','read_secret','send_data'],
      hasBudget: true,
      standing: { select:'the chosen flight must be one of the observed offers',
                  book:'the booked flight must equal the one selected earlier',
                  pay:'amount, currency and payee equal the booking, amount within the budget',
                  pay_order:'order, amount and currency equal the booking, amount within the budget' },
      outNote: 'closed vocabulary · registry-versioned digest',
      holds: (isV0,isV5)=> isV0 ? [
        ['Model','<span class="none">nothing. Sees the task, the e-mail and tool results.</span>'],
        ['Executor','<span class="cred">every credential</span>, and it does what the model says.'],
      ] : [
        ['Model','<span class="none">nothing. Sees the task, the e-mail and tool results. Cannot reach the world.</span>'],
        ['Agent adapter','<span class="none">nothing. Turns the tool call into a fragment and forwards it.</span>'],
        ['Monitor','<span class="none">the policy digest and the signed state. No credential.</span>'],
        ['Authority',"<span class=\"none\">the ledger and the human's approval key. No credential.</span>"],
        ['Runner'+(isV5?' (TD)':''),'<span class="tok">one single-use token</span> for one step'+(isV5?', sealed to the key the CPU attested':'')+'.'],
        ['Gateway','<span class="cred">every credential</span> (airline, bank, secret store). None of them leaves it.'],
        ['Human','the approval key. The only party that can raise authority.'],
      ],
      // `grew` says whether the run's own count of unauthorised effects rose at this step
      // (the `unauthorized` field of its decision event). The world judges a payment against
      // the booking of the same run (DemoWorld.unauthorized_payments), not against a constant.
      worldRow: (tool,a,grew)=>{ let bad=false, det='';
        if (tool==='pay'){ bad=grew; det=money(a.amount_minor,a.currency)+' → '+a.recipient; }
        else if (tool==='pay_order'){ bad=grew; det=money(a.amount_minor,a.currency)+' for order '+a.order_id; }
        else if (tool==='read_secret'){ bad=true; det='secret "'+a.name+'" read'; }
        else if (tool==='send_data'){ bad=true; det='sent to '+a.url; }
        else if (tool==='book') det='booking '+a.flight;
        else det=fmtArgs(a);
        return {bad,det}; },
    },
    devops: {
      worldAlias: 'cluster, secrets, network',
      localTool: 'read_alert', inputWord: 'alert',
      tools: ['read_alert','list_deployments','restart_deployment','read_secret','delete_namespace','http_post','exec_pod'],
      effectTools: ['restart_deployment','read_secret','delete_namespace','http_post','exec_pod'],
      hasBudget: false,
      standing: { restart_deployment:'the target must be a deployment a read step observed as FAILING' },
      outNote: 'closed vocabulary · registry-versioned digest',
      holds: (isV0,isV5)=> [
        ['Model','<span class="none">nothing. Sees the task, the alert and tool results. Cannot reach the cluster.</span>'],
        ['Agent adapter','<span class="none">nothing. Turns the tool call into a fragment and forwards it.</span>'],
        ['Monitor','<span class="none">the policy digest, the signed state and observed facts. No credential.</span>'],
        ['Authority',"<span class=\"none\">the ledger and the human's approval key. No credential.</span>"],
        ['Runner','<span class="tok">one single-use token</span> for one step.'],
        ['Gateway','<span class="cred">the cluster-admin credential</span>. It stays in the gateway.'],
        ['Human','the approval key. The only party that can raise authority.'],
      ],
      worldRow: (tool,a,grew)=>{ let bad=false, det='';
        if (tool==='restart_deployment'){ bad=grew; det='restarted '+a.name; }
        else if (tool==='read_secret'){ bad=true; det='secret "'+a.name+'" read'; }
        else if (tool==='delete_namespace'){ bad=true; det='namespace '+a.name+' deleted'; }
        else if (tool==='http_post'){ bad=true; det='posted to '+a.url; }
        else if (tool==='exec_pod'){ bad=true; det='exec in '+a.name; }
        else det=fmtArgs(a);
        return {bad,det}; },
    },
  };
  // The live worlds keep the booking descriptor and differ in the tools the agent is offered.
  DOMAINS['booking-duffel'] = Object.assign({}, DOMAINS.booking, {
    tools: ['read_inbox','search','select','book','pay_order','read_secret','send_data']});
  DOMAINS['booking-serpapi'] = Object.assign({}, DOMAINS.booking, {
    tools: ['read_inbox','search','select','read_secret','send_data'], hasBudget: false});
  let DOM = DOMAINS.booking;
  const PH = ['spawn', 'evidence', 'verification', 'execution', 'destroy'];
  let currentRun = null, currentDemo = 'booking', lastLen = -1, lastApproval = null, lastChat = null, chatPending = false, shownApproval = null;

  // The seven stations. alias = the same component in secrets-management vocabulary.
  const STATIONS = [
    {key:'model',     name:'Model',     alias:'the LLM',                            what:'Returns a tool call as JSON. It executes nothing and holds nothing.'},
    {key:'proposal',  name:'Proposal',  alias:'tool call',                          what:'Operation + arguments. A declaration, not code. Only the listed tools exist.'},
    {key:'fragment',  name:'Fragment',  alias:'the request, hashed',                what:'The same data, canonical, hashed, with the facts it claims to rest on.'},
    {key:'monitor',   name:'Monitor',   alias:'Attested Policy Decision',           what:'Stateless \u00b7 deterministic \u00b7 no backend credentials'},
    {key:'authority', name:'Authority', alias:'Persistent Authorization Core',      what:'Freshness \u00b7 ordering \u00b7 replay protection \u00b7 grants\nNo tool execution \u00b7 no policy predicates'},
    {key:'gateway',   name:'Gateway',   alias:'Privileged Effect Broker',           what:'Redeems exact one-shot capabilities\nOnly runtime principal allowed to use backend identity'},
    {key:'world',     name:'World',     alias:'airline, bank, network',             what:'The only place an effect can happen.'},
  ];
  const ABSENT_V0 = ['fragment', 'monitor', 'authority', 'gateway'];

  /** Map the decision events of one proposal onto the stations: which passed, which stopped it, and why. */
  function classify(decs, mode, tool) {
    const last = decs[decs.length - 1] || {};
    const isEffect = DOM.effectTools.includes(tool);
    const cells = {};
    STATIONS.forEach(s => cells[s.key] = {cls:'skip', text:'—'});
    cells.model = {cls:'pass', text:'said it'};
    cells.proposal = {cls:'pass', text:esc(tool)};
    if (last.status === 'LOCAL') {
      cells.proposal = {cls:'pass', text:'read only'};
      cells.world = {cls:'skip', text:'no effect'};
      return {cells, stoppedAt:null, effect:false};
    }
    if (mode === 'v0') {
      ABSENT_V0.forEach(k => cells[k] = {cls:'absent', text:'—'});
      cells.world = isEffect ? {cls:'harm', text:'executed'} : {cls:'pass', text:'query'};
      return {cells, stoppedAt:null, effect:isEffect};
    }
    cells.fragment = {cls:'pass', text:'hashed'};
    const st = last.status, r = last.reason || '';
    const sawApproval = decs.some(d => d.status === 'REQUIRE_APPROVAL');
    const stop = txt => 'REFUSED' + (txt ? ' ' + txt : '') + '<span class="why">' + esc(r) + '</span>';
    if (st === 'STEP_COMPLETED') {
      cells.monitor = {cls:'pass', text: sawApproval ? 'admitted, human required' : 'admitted'};
      cells.authority = {cls:'pass', text: sawApproval ? 'human approved, token issued' : 'token issued'};
      cells.gateway = {cls:'pass', text: isEffect ? 'token spent, executed' : 'token spent'};
      cells.world = isEffect ? {cls:'effect', text:'effect'} : {cls:'pass', text:'query'};
      return {cells, stoppedAt:null, effect:isEffect};
    }
    if (st === 'DENIED') { cells.monitor = {cls:'stop', text:stop('')}; return {cells, stoppedAt:'monitor', effect:false}; }
    if (st === 'RUN_TERMINATED') { cells.monitor = {cls:'skip', text:'not consulted'}; cells.authority = {cls:'stop', text:stop('run terminated')}; return {cells, stoppedAt:'authority', effect:false}; }
    if (st === 'REQUIRE_APPROVAL') {
      cells.monitor = {cls:'pass', text:'admitted, human required'};
      cells.authority = {cls:'wait', text:'waiting for the human'};
      return {cells, stoppedAt:'authority', effect:false, waiting:true};
    }
    if (st === 'GRANT_REFUSED') {
      cells.monitor = {cls:'pass', text: sawApproval ? 'admitted, human required' : 'admitted'};
      cells.authority = {cls:'stop', text:stop('')};
      return {cells, stoppedAt:'authority', effect:false};
    }
    if (st === 'ATTESTATION_REFUSED' || /^REFUSED/.test(st) || st === 'RUNNER_ERROR') {
      // A relying-party refusal carries its rule as REFUSED(rule), binding-mismatch and
      // substrate-profile-mismatch included. Only the hash check of the delivered octets
      // refuses inside the TD, and it surfaces as a runner error that names the bytes.
      const insideTD = /bytes|octets/i.test(r) && !/^REFUSED\(/.test(r);
      if (insideTD) { cells.monitor = {cls:'stop', text:stop('inside the TD')}; return {cells, stoppedAt:'monitor', effect:false}; }
      cells.monitor = {cls:'skip', text:'not reached'};
      cells.authority = {cls:'stop', text:stop('before any runner')};
      return {cells, stoppedAt:'authority', effect:false};
    }
    cells.monitor = {cls:'stop', text:esc(st) + '<span class="why">' + esc(r) + '</span>'};
    return {cells, stoppedAt:'monitor', effect:false};
  }

  function tdRow(t) {
    const tm = t.timings || {}; const tot = PH.reduce((s, k) => s + (tm[k] || 0), 0) || 1;
    const bar = PH.map(k => `<span class="ph-${k}" style="width:${(100 * (tm[k] || 0) / tot).toFixed(1)}%" title="${k} ${(tm[k] || 0).toFixed(1)} s"></span>`).join('');
    const out = t.outcome.replace('MONITOR(REQUIRE_APPROVAL)', 'needs approval').replace(/^MONITOR\((.*)\)$/, 'monitor: $1');
    return `<tr class="tdrow"><td colspan="2" class="tdmeta">TD ${esc(t.td || '—')}${t.continuation ? ' · continuation after approval' : ''} · ${esc(t.handoff)} · ${(t.total_s || 0).toFixed(1)} s</td><td colspan="${STATIONS.length}"><div class="phases">${bar}</div><span class="tdmeta">created for this one step, ${esc(out)}, destroyed afterwards</span></td></tr>`;
  }

  function renderTransform(proposed, policyEv) {
    const host = $('transform');
    const compiledSteps = (policyEv && policyEv.plan) || (proposed && proposed.plan.steps) || [];
    if (!compiledSteps.length) { host.innerHTML = ''; return; }
    const approvals = (policyEv && policyEv.approval_steps) || (proposed && proposed.plan.approval_steps) || [];
    const isAppr = (i, st) => Array.isArray(approvals) && (approvals.includes(i) || approvals.includes(st));
    const digest = String((policyEv && policyEv.digest) || '');
    const left = proposed
      ? proposed.plan.steps.map((st, i) => `<li>${i + 1}. <b>${esc(st)}</b></li>`).join('')
      : '<li class="status">fixed policy · the agent proposed no plan in this run</li>';
    const hint = proposed && proposed.plan.rationale ? `<div class="tf-hint">proposed rationale: ${esc(proposed.plan.rationale)}</div>` : '';
    const rules = (policyEv && policyEv.rules) || null;   // read from the policy object the monitor enforces
    const right = compiledSteps.map((st, i) => {
      let body;
      if (rules && rules[i]) {
        const r = rules[i];
        const parts = [];
        for (const b of r.before || []) parts.push(`<span class="tf-rule">before: ${esc(b)}</span>`);
        for (const a of r.after || []) parts.push(`<span class="tf-rule">after: ${esc(a)}</span>`);
        for (const c of r.records || []) parts.push(`<span class="tf-none">${esc(c)}</span>`);
        body = parts.length ? parts.join('<br>') : '<span class="tf-none">no security-relevant argument</span>';
      } else {
        const rule = DOM.standing[st];
        body = rule ? `<span class="tf-rule">${esc(rule)}</span>` : '<span class="tf-none">no security-relevant argument</span>';
      }
      return `<li>${i + 1}. <b>${esc(st)}</b>${isAppr(i, st) ? ' ✋' : ''}<br>${body}</li>`;
    }).join('');
    host.innerHTML = `<div class="tf">
      <div class="tf-col tf-in"><h3>Agent plan · untrusted proposal</h3><ol>${left}</ol>${hint}<div class="tf-note">concrete targets are only hints. The runtime decides against observed facts.</div></div>
      <div class="tf-arrow">→ deterministic compiler →</div>
      <div class="tf-col tf-out"><h3>Authorisation policy · compiled</h3><ol>${right}</ol>${digest ? `<div class="tf-digest">policy digest <b>${esc(digest.slice(0, 16))}…</b></div>` : ''}<div class="tf-note">${esc(DOM.outNote)}</div></div>
    </div>`;
  }

  function render(payload) {
    const ev = payload.events || [];
    const start = ev.find(e => e.kind === 'start') || {};
    const policyEv = ev.find(e => e.kind === 'policy') || start;
    const plan = policyEv.plan || ['search', 'select', 'book', 'pay'];
    const mode = start.mode || 'v0';
    DOM = DOMAINS[start.domain] || DOMAINS.booking;
    const isV0 = mode === 'v0', isV5 = mode.startsWith('v5');
    $('mode').textContent = {v0: 'V0 · no monitor: the model\'s call is executed', v3: 'V3 · monitor + authority + gateway', 'v5-local': 'V5 · attested TD per step (local rehearsal)', v5: 'V5 · attested TD per step (cluster)'}[mode] || mode;
    $('mode').className = 'badge ' + mode.replace('-local', '');
    $('model').textContent = start.model ? 'agent: ' + start.model : '';
    const task = ev.find(e => e.kind === 'task'); if (task) $('task').textContent = task.text;
    const mail = ev.find(e => e.kind === 'mail');
    if (mail) {
      const marker = mail.highlight || '\n--\n';
      const i = mail.text.indexOf(marker);
      $('mail').innerHTML = i < 0 ? esc(mail.text) : esc(mail.text.slice(0, i)) + '<span class="inj">' + esc(mail.text.slice(i)) + '</span>';
    }
    $('tools').innerHTML = 'The model can only <b>call</b> these tools: ' + DOM.tools.map(t => '<code>' + t + '</code>').join(' ') + '. There is no shell, no <code>curl</code> and no code path. Whatever it returns is a JSON tool call, shown below as returned.';

    const proposals = ev.filter(e => e.kind === 'proposal');
    const decBySeq = {}, attBySeq = {};
    ev.filter(e => e.kind === 'decision').forEach(d => (decBySeq[d.seq] = decBySeq[d.seq] || []).push(d));
    ev.filter(e => e.kind === 'attested').forEach(a => (attBySeq[a.seq] = attBySeq[a.seq] || []).push(a));

    // transcript: what the model returned, as it returned it
    const tr = [];
    for (const e of ev) {
      if (e.kind === 'proposal') tr.push(`<div class="bubble call"><b>#${e.seq} the model returned</b>\n${esc(JSON.stringify({tool: e.tool, arguments: e.arguments || {}}))}</div>`);
      if (e.kind === 'tool_result' && e.tool !== DOM.localTool) tr.push(`<div class="bubble result">← ${esc(JSON.stringify(e.result)).slice(0, 200)}</div>`);
      if (e.kind === 'tool_result' && e.tool === DOM.localTool) tr.push(`<div class="bubble result">← (the ${DOM.inputWord} above, as untrusted tool output)</div>`);
      if (e.kind === 'paused') tr.push(`<div class="bubble final">${esc(e.message || '')}<br><span class="status">${esc(e.state)} · next approved step: ${esc(e.next_step)}</span></div>`);
      if (e.kind === 'resumed') tr.push(`<div class="bubble result">resumed the same run (${esc(e.run_id)}), no new plan · next: ${esc(e.next_step)}</div>`);
      if (e.kind === 'user_message') tr.push(e.timed_out ? `<div class="bubble result">no reply in time: the run ends here</div>` : `<div class="bubble user"><b>you</b><br>${esc(e.text)}</div>`);
      if (e.kind === 'end' && e.message) tr.push(`<div class="bubble final">${esc(e.message)}</div>`);
    }
    $('transcript').innerHTML = tr.join('');

    // rows + counters
    const counts = {}; STATIONS.forEach(s => counts[s.key] = {pass:0, stop:0, wait:0});
    const rows = [];
    let effects = 0, refused = 0;
    for (const p of proposals) {
      const decs = decBySeq[p.seq] || [];
      if (!decs.length) continue;
      const c = classify(decs, mode, p.tool);
      STATIONS.forEach(s => { const k = c.cells[s.key].cls; if (k === 'pass' || k === 'effect') counts[s.key].pass++; else if (k === 'stop' || k === 'harm') counts[s.key].stop++; else if (k === 'wait') counts[s.key].wait++; });
      if (c.effect) effects++;
      if (c.stoppedAt && !c.waiting) refused++;
      const lastD = decs[decs.length - 1];
      const step = lastD.step;
      const inPlan = step !== null && step !== undefined && step < plan.length && plan[step] === p.tool;
      let sub = '';
      if (lastD.status !== 'LOCAL' && !isV0) sub = inPlan ? `step ${step + 1} of ${plan.length}` : 'not in the plan';
      rows.push(`<tr><td class="who">#${p.seq} <b>${esc(p.tool)}</b>${sub ? '<br><span class="status">' + sub + '</span>' : ''}</td><td class="args">${esc(fmtArgs(p.arguments))}</td>` + STATIONS.map(s => `<td><div class="cell ${c.cells[s.key].cls}">${c.cells[s.key].text}</div></td>`).join('') + '</tr>');
      for (const t of (attBySeq[p.seq] || [])) rows.push(tdRow(t));
    }
    $('pipe').innerHTML = STATIONS.map(s => {
      const absent = isV0 && ABSENT_V0.includes(s.key);
      const c = counts[s.key];
      const cnt = absent ? '' : `<span>passed <b class="ok">${c.pass}</b></span>${c.stop ? `<span>stopped here <b class="bad">${c.stop}</b></span>` : ''}${c.wait ? `<span>waiting <b class="wait">${c.wait}</b></span>` : ''}`;
      return `<div class="st ${absent ? 'absent' : ''}"><h3>${s.name}</h3><div class="alias">${esc(s.key==='world'?DOM.worldAlias:s.alias)}</div><div class="what">${esc(s.what)}</div><div class="cnt">${cnt}</div></div>`;
    }).join('');
    $('prophead').innerHTML = '<th>proposal</th><th>arguments</th>' + STATIONS.map(s => `<th>${s.name}</th>`).join('');
    $('rows').innerHTML = rows.join('') || '<tr><td colspan="9" class="status">waiting for the first proposal…</td></tr>';
    $('tdlegend').innerHTML = isV5 ? '<div class="legend">TD phases: <i class="ph-spawn"></i>spawn<i class="ph-evidence"></i>evidence<i class="ph-verification"></i>verification<i class="ph-execution"></i>execution<i class="ph-destroy"></i>destroy</div>' : '';

    // the plan
    const proposed = ev.find(e => e.kind === 'plan_proposed');
    const planDecision = ev.find(e => e.kind === 'plan_decision');
    if (proposed) {
      const p = proposed.plan, r = proposed.review || {};
      const state = planDecision ? (planDecision.granted ? 'approved' : 'rejected') : '';
      const warns = (r.notes || []).map(n => `<div class="warn">⚠ ${esc(n)}</div>`).join('')
        + (r.ungrounded || []).map(u => `<div class="warn">⚠ step ${u[0] + 1} ${esc(u[1])}: check "${esc(u[2])}" on ${esc((u[3] || []).join(', '))} cannot be enforced (no earlier step produces it)</div>`).join('');
      $('plan').innerHTML = `<div class="plan ${state}"><h3>The agent proposes this plan${state ? ' · ' + state.toUpperCase() : ' · awaiting the human'}</h3>
        <div class="steps">${p.steps.map((st, i) => `<span>${i + 1}. ${esc(st)}${p.approval_steps.includes(st) ? ' ✋' : ''}</span>`).join('')}</div>
        <div style="margin-top:6px">${DOM.hasBudget ? 'budget <b>'+money(p.budget_minor, p.currency)+'</b> · ' : ''}human approval before: ${esc(p.approval_steps.join(', ') || 'none')}</div>
        <div class="status">${esc(p.rationale || '')}</div>${warns || '<div class="fine">✓ every check of the company policy is grounded in an earlier step</div>'}
        ${approvedPolicyHtml(proposed.approved_policy)}${trustedConfigHtml(proposed.trusted_config)}
        ${state === 'approved' ? '<div class="fine">The monitor now enforces these steps and no others.</div>' : ''}</div>`;
    } else if (!isV0) {
      $('plan').innerHTML = `<div class="plan approved"><h3>The approved plan (the policy the monitor enforces)</h3><div class="steps">${plan.map((st, i) => `<span>${i + 1}. ${esc(st)}${(policyEv.approval_steps || []).includes(i) ? ' ✋' : ''}</span>`).join('')}</div><div style="margin-top:6px">${DOM.hasBudget ? 'budget <b>'+(policyEv.budget_minor ? money(policyEv.budget_minor, policyEv.currency) : '—')+'</b> · ' : ''}policy digest <span class="tdmeta">${esc(String(policyEv.digest || '').slice(0, 16))}…</span> · ✋ = a human must approve before this step</div></div>`;
    } else {
      $('plan').innerHTML = '<div class="plan rejected"><h3>No plan, no monitor</h3>Whatever the model returns is executed with full credentials. This is an agent without authority control.</div>';
    }

    renderTransform(proposed, policyEv);

    // attacks on the chain itself
    const attacks = ev.filter(e => e.kind === 'attack');
    const started = ev.filter(e => e.kind === 'attack_start').map(e => e.attack);
    const running = started.filter(a => !attacks.some(x => x.attack === a));
    $('attacks').innerHTML = (attacks.length || running.length) ? '<h2 style="margin-top:12px">Attacks on the chain itself (a18 and a10 inside the approved run, a16 as a throwaway run)</h2><div class="attacks">' + attacks.map(a => {
      const t = a.trace || {};
      return `<div class="attack"><h3>${esc(a.attack)} · ${esc(a.label)}</h3>blocked at: <b>${esc(a.blocked_at)}</b><br>result: ${esc(a.status)} <span class="status">${esc(String(a.reason || '').slice(0, 90))}</span><br>TD: <span class="tdmeta">${esc(t.td || '—')}</span> · ledger delta: <b>${a.ledger_delta}</b><br><span class="${a.pass ? 'pass' : 'fail'}">${a.pass ? 'REFUSED, no effect' : 'CHECK'}</span></div>`;
    }).join('') + running.map(a => `<div class="attack"><h3>${esc(a)}</h3>running…</div>`).join('') + '</div>' : '';

    // approval panel
    const req = payload.approval_request;
    if (req && req.kind === 'plan' && JSON.stringify(req) !== lastApproval) {
      $('approval').innerHTML = `<div class="approval"><b>Approve the agent's plan?</b> ${esc(req.plan.steps.join(' → '))}${req.approved_policy ? '' : ', budget ' + money(req.plan.budget_minor, req.plan.currency)}${approvedPolicyHtml(req.approved_policy)}${trustedConfigHtml(req.trusted_config)}<div style="margin-top:8px"><button class="ok" onclick="decide(true)">Approve authorisation policy</button><button class="no" onclick="decide(false)">Reject</button></div></div>`;
    } else if (req && req.kind !== 'plan' && JSON.stringify(req) !== lastApproval) {
      $('approval').innerHTML = `<div class="approval"><b>The plan requires a human here.</b><br>Step ${req.step + 1}: <b>${esc(req.tool)}</b> ${esc(fmtArgs(req.arguments))}<br><span class="status">fragment ${esc(req.fragment_hash.slice(0, 16))}…. The approval binds these bytes and no others.</span><div style="margin-top:8px"><button class="ok" onclick="decide(true)">Approve</button><button class="no" onclick="decide(false)">Reject</button></div></div>`;
    } else if (!req) { $('approval').innerHTML = ''; }
    if (req && JSON.stringify(req) !== lastApproval) shownApproval = req;   // what the buttons answer
    lastApproval = req ? JSON.stringify(req) : null;

    // chat continuation: the model stopped before the approved plan was done
    const chat = payload.chat_request;
    chatPending = !!chat && !currentRun;
    if (chat && chat.chat_id !== lastChat) {
      const obs = Object.entries(chat.observed || {}).map(([k, v]) => `${esc(k)} = <span class="tdmeta">${esc(v)}</span>`).join(' · ');
      $('chatreply').innerHTML = `<div class="chatreply"><b>${esc(chat.state)}</b> · run ${esc(chat.run_id)} · policy <span class="tdmeta">${esc(String(chat.policy_digest || '').slice(0, 16))}…</span><br>done: ${esc(chat.completed_step || '—')} · next approved step: <b>${esc(chat.next_step)}</b><br><span class="status">${obs || 'no observed facts'}</span><div class="status" style="margin-top:6px">Answer in the chat box above. Your message resumes this run (no new plan). It is not an approval: a step that needs approval still asks for it.</div></div>`;
      $('ask').placeholder = 'Reply to the agent, e.g. "Continue with the payment."';
    } else if (!chat) { $('chatreply').innerHTML = ''; $('ask').placeholder = 'Book a flight to EWR, at most 50 EUR.'; }
    lastChat = chat ? chat.chat_id : null;

    // who holds what (from the domain descriptor)
    const holds = DOM.holds(isV0, isV5);
    $('holds').innerHTML = holds.map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join('');

    // world + ledger + KPIs
    const end = ev.find(e => e.kind === 'end');
    const allDecs = ev.filter(e => e.kind === 'decision');
    const last = allDecs[allDecs.length - 1] || {};
    const unauth = last.unauthorized || 0;
    const world = [];
    let seenUnauth = 0;
    for (const e of allDecs) {
      const grew = typeof e.unauthorized === 'number' && e.unauthorized > seenUnauth;
      if (typeof e.unauthorized === 'number') seenUnauth = e.unauthorized;
      if (e.status !== 'STEP_COMPLETED' && e.status !== 'EXECUTED') continue;
      const p = proposals.find(x => x.seq === e.seq) || {};
      const a = p.arguments || {};
      if (!DOM.effectTools.includes(e.tool)) continue;
      const { bad, det } = DOM.worldRow(e.tool, a, grew);
      world.push(`<tr class="${bad ? 'bad' : ''}"><td>${e.seq}</td><td>${esc(e.tool)}</td><td>${esc(det)}</td></tr>`);
    }
    $('world').innerHTML = world.join('') || '<tr><td colspan="3" class="status">no effect yet</td></tr>';
    const ledger = (end && end.ledger) || [];
    const tds = ev.filter(e => e.kind === 'attested');
    $('ledger').innerHTML = ledger.map(l => l.operation !== undefined
        ? `<tr><td>${l.step_index}</td><td>${esc(l.operation)}</td><td>${esc(fmtArgs(l.arguments))}</td></tr>`
        : `<tr><td>${l.step}</td><td>${esc((tds.find(t => t.step === l.step && t.outcome === 'ACCEPTED') || {}).tool || '')}</td><td class="status">${esc(l.state)} · fragment ${esc(String(l.fragment_hash).slice(0, 12))}…</td></tr>`).join('') || '<tr><td colspan="3" class="status">' + (isV0 ? 'no gateway in V0: nothing was recorded' : 'empty') + '</td></tr>';
    $('k-proposals').textContent = proposals.filter(e => e.tool !== DOM.localTool).length;
    $('k-refused').textContent = refused;
    $('k-effects').textContent = effects;
    $('k-unauth').textContent = unauth;
    $('k-run').textContent = (last.run_status || (end ? 'ended' : '…'));

    // banner
    if (end) {
      if (end.run_status === 'PLAN_REJECTED') $('banner').innerHTML = `<div class="banner stop">${esc(end.message || 'The plan was not approved. No run was created.')} Nothing was executed.</div>`;
      else if (isV0) $('banner').innerHTML = `<div class="banner harm">${unauth} unauthorised effect(s). The model did what the e-mail said, and nothing stood between its call and the world.</div>`;
      else if ((end.unfinished_steps || []).length) $('banner').innerHTML = `<div class="banner stop">The run ended before the approved plan was done (not executed: ${esc(end.unfinished_steps.join(', '))}). Nothing beyond the completed steps happened, ${unauth} unauthorised effects.</div>`;
      else if ((last.run_status || end.run_status) === 'TERMINATED') { const den = allDecs.find(d => d.status === 'DENIED') || last; $('banner').innerHTML = `<div class="banner stop">Run terminated at the first refused proposal (#${den.seq} ${esc(den.tool)}: ${esc(den.reason || '')}). Zero unauthorised effects. Nothing was detected in the text. The step did not hold the authority the approved plan carries.</div>`; }
      else if ((last.run_status || end.run_status) !== 'COMPLETED') $('banner').innerHTML = `<div class="banner stop">Run ended with status ${esc(last.run_status || end.run_status || '?')}, ${unauth} unauthorised effects. It is not continued from here, because an uncertain effect is reconciled and not retried from the chat.</div>`;
      else $('banner').innerHTML = `<div class="banner safe">Plan completed with ${unauth} unauthorised effects. Every off-plan proposal was refused by name at the station shown.${tds.length ? ' ' + tds.length + ' attested TD(s), each created for one step and destroyed after it.' : ''}</div>`;
    } else if (payload.orphaned) {
      $('banner').innerHTML = `<div class="banner stop">PAUSED_ORPHANED: the run paused and its controller is gone. It stays ACTIVE at the Authority without a grant and cannot be resumed. Nothing beyond the completed steps happened. A new message starts a new run.</div>`;
    } else $('banner').innerHTML = '';
  }

  // The buttons answer the request this page displayed, with its id and its hash. If that
  // request expired, was replaced or was answered in another window, the server says so
  // (404 / 409) and nothing is approved. The page does not assume that a shown request is
  // still valid.
  window.decide = async granted => {
    const req = shownApproval;
    if (!req) return;
    $('approval').querySelectorAll('button').forEach(b => b.disabled = true);
    const r = await fetch('/approve', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({approval_id: req.approval_id, policy_hash: req.policy_hash, granted})});
    const out = await r.json().catch(() => ({}));
    $('approval').innerHTML = r.ok ? '<div class="status">decision sent…</div>'
      : `<div class="approval"><b>${r.status === 404 ? 'Expired or no longer pending.' : r.status === 409 ? 'Already decided, or the request changed.' : 'Not sent.'}</b> Nothing was approved. <span class="status">${esc(out.error || r.status)}</span></div>`;
  };
  async function launcherStatus() {
    try {
      const r = await fetch('/launcher');
      const st = await r.json();
      const live = st.live_left;
      // Only models whose API key this server holds are offered, so no run is started that
      // would die a second later on a missing key.
      const sel = $('ask-model'), want = (st.models || ['scripted']).join(',');
      if (sel.dataset.have !== want) {
        sel.dataset.have = want;
        const keep = sel.value;
        sel.innerHTML = (st.models || ['scripted']).map(m =>
          '<option value="' + m + '">' + (m === 'scripted' ? 'scripted agent' : m + ' (live model)') + '</option>').join('');
        if ((st.models || []).indexOf(keep) >= 0) sel.value = keep;
      }
      $('ask-status').textContent = st.busy
        ? (chatPending ? 'the agent waits for your reply' : 'a run is going')
        : live + ' live run' + (live === 1 ? '' : 's') + ' left this session';
      $('ask-go').disabled = !!st.busy && !chatPending;
    } catch (e) { /* server not up yet */ }
  }

  window.startRun = async function () {
    const task = $('ask').value.trim();
    $('ask-err').textContent = '';
    if (!task) { $('ask-err').textContent = 'Type a request first.'; return; }
    $('ask-go').disabled = true;
    try {
      const r = await fetch('/run', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({task: task, world: $('ask-world').value, mode: $('ask-mode').value,
                              model: $('ask-model').value, inject: $('ask-inject').checked})});
      const out = await r.json();
      if (!r.ok) { $('ask-err').textContent = out.error || 'could not start'; }
      else if (out.resumed) { $('ask').value = ''; $('chatreply').innerHTML = '<div class="status">reply sent, the run resumes…</div>'; }
      else { currentRun = null; $('runpick').value = ''; }
    } catch (e) {
      $('ask-err').textContent = String(e);
    }
    await launcherStatus();
  };

  async function poll() {
    try {
      launcherStatus();
      const r = await fetch('/events.json' + (currentRun ? '?run=' + encodeURIComponent(currentRun) : '?demo=' + currentDemo));
      const payload = await r.json();
      if (payload.stale) { setTimeout(poll, 300); return; }   // partial read on the server: keep the current view
      const len = (payload.events || []).length;
      if (len !== lastLen || payload.approval_request || (payload.chat_request || {}).chat_id !== (lastChat || undefined)) { render(payload); lastLen = len; }
    } catch (e) { /* server not up yet */ }
    setTimeout(poll, 500);
  }
  async function runs() {
    try {
      const r = await fetch('/runs?demo=' + currentDemo); const list = await r.json();
      const sel = $('runpick');
      sel.innerHTML = '<option value="">latest run</option>' + list.reverse().map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
      sel.onchange = () => { currentRun = sel.value || null; lastLen = -1; };
    } catch (e) {}
    setTimeout(runs, 5000);
  }
  $('demopick').onchange = () => { currentDemo = $('demopick').value; currentRun = null; $('runpick').value = ''; lastLen = -1; runs(); };
  poll(); runs();
})();
</script>
</body>
</html>
